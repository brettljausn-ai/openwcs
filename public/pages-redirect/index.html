<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>openWCS has moved to openwcs.ai</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://openwcs.ai/">
  <!-- The GitHub Pages mirror is retired; everything lives at https://openwcs.ai.
       Redirect immediately, preserving the deep-link path under the /openwcs/ base. -->
  <script>
    (function () {
      // Map an old Pages URL to its clean openwcs.ai route: drop the /openwcs project base,
      // any leading slash, the legacy .html suffix, and a trailing "index".
      // /openwcs/asrs.html -> asrs ; /openwcs/ -> '' ; /openwcs/index.html -> ''.
      var path = location.pathname
        .replace(/^\/openwcs(\/|$)/, '')
        .replace(/^\/+/, '')
        .replace(/\.html$/, '')
        .replace(/(^|\/)index$/, '');
      location.replace('https://openwcs.ai/' + path + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://openwcs.ai/">
  <style>
    body { font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #0f1115; color: #e6e8eb; }
    a { color: #8DC63F; }
  </style>
</head>
<body>
  <p>openWCS has moved to <a href="https://openwcs.ai/">openwcs.ai</a>. Redirecting&hellip;</p>
</body>
</html>
