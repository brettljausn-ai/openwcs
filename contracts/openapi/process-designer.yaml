openapi: 3.0.3
info:
  title: openWCS Process Designer API
  version: 0.1.0
  description: >
    Engine + storage for configurable handheld operator processes. A process is a versioned JSON
    definition (a flow of handheld screens plus task steps); exactly one version is ACTIVE per
    process key. The handheld client walks the screen flow and evaluates branch conditions locally
    (so it works offline); the server owns definition storage and versioning, instance
    checkpointing for device-swap resume, and task-step execution. Task steps run a curated library
    of pre-built handlers that call existing audited openWCS services with the operator's forwarded
    identity, so downstream RBAC and warehouse scope apply. See docs/process-designer-spec.md.
servers:
  - url: /api/process-designer
    description: Via the API gateway

tags:
  - name: Definitions
  - name: Instances
  - name: Assist
  - name: Verify

paths:
  /defs:
    get:
      tags: [Definitions]
      summary: List definition summaries
      operationId: listDefinitions
      parameters:
        - name: status
          in: query
          required: false
          description: "Optional status filter: DRAFT, ACTIVE, or ARCHIVED."
          schema: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
      responses:
        "200":
          description: Definition summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DefinitionSummary' }
    post:
      tags: [Definitions]
      summary: Create a DRAFT definition
      description: "Creates a DRAFT with an auto-incremented version for the process key (max existing + 1)."
      operationId: createDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDefinitionRequest' }
      responses:
        "201":
          description: Created DRAFT summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefinitionSummary' }
        "400": { description: Invalid request }
        "403": { description: "Missing PROCESS_DESIGN_EDIT permission" }

  /defs/import:
    post:
      tags: [Definitions]
      summary: Import a full model document as a new DRAFT
      description: >
        Body is a full process model document (processKey, title, icon, dataSchema, start, steps).
        Creates a new DRAFT version for that processKey after validating the model shape; any incoming
        version or status is ignored and overridden. Lets definitions move between environments.
      operationId: importDefinition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessModel' }
      responses:
        "201":
          description: Created DRAFT summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefinitionSummary' }
        "400": { description: "Missing processKey or title" }
        "403": { description: "Missing PROCESS_DESIGN_EDIT permission" }
        "422":
          description: "The imported model failed validation, with the list of problems"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }

  /defs/{key}/{version}/duplicate:
    post:
      tags: [Definitions]
      summary: Duplicate a version into a new DRAFT
      description: >
        Clones the source version's model JSON into a fresh DRAFT of the same process key with the
        next version number. Lets a user iterate from a published version without mutating it.
      operationId: duplicateDefinition
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "201":
          description: New DRAFT summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefinitionSummary' }
        "403": { description: "Missing PROCESS_DESIGN_EDIT permission" }
        "404": { description: Source version not found }

  /tasks:
    get:
      tags: [Definitions]
      summary: The curated task catalog
      description: >
        The registered curated task types with their label and named inputs/outputs, so the
        designer's task picker and input/output mapping is driven by the real server registry.
      operationId: listTasks
      responses:
        "200":
          description: Task specs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskSpec' }

  /defs/{key}/{version}:
    get:
      tags: [Definitions]
      summary: Get one version's full model JSON
      operationId: getDefinition
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The process model document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessModel' }
        "404": { description: Not found }
    put:
      tags: [Definitions]
      summary: Replace a DRAFT's model JSON
      description: "Updates the DRAFT body. Returns 409 if the version is not DRAFT (published/archived versions are immutable)."
      operationId: updateDefinition
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProcessModel' }
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessModel' }
        "404": { description: Not found }
        "409": { description: "Not a DRAFT, cannot edit" }

  /defs/{key}/active:
    get:
      tags: [Definitions]
      summary: Get the ACTIVE version's full model JSON
      operationId: getActiveDefinition
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The ACTIVE process model document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProcessModel' }
        "404": { description: "No active definition for this key" }

  /defs/{key}/{version}/publish:
    post:
      tags: [Definitions]
      summary: Publish a DRAFT (set ACTIVE, archive prior ACTIVE)
      description: >
        Validates the definition (every step reachable, transitions and next point to existing
        steps, screen writeTo and task references resolve, start exists). On success the version
        becomes ACTIVE and the previously ACTIVE version for the key is archived atomically. On
        failure returns 422 with the list of problems.
      operationId: publishDefinition
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Published summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefinitionSummary' }
        "403": { description: "Missing PROCESS_DESIGN_EDIT permission" }
        "404": { description: Not found }
        "409": { description: "Not a DRAFT, cannot publish" }
        "422":
          description: "Validation failed, with the list of problems"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }

  /defs/{key}/{version}/archive:
    post:
      tags: [Definitions]
      summary: Archive a version
      operationId: archiveDefinition
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Archived summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefinitionSummary' }
        "404": { description: Not found }

  /processes:
    get:
      tags: [Definitions]
      summary: List distinct process keys with their active version
      description: "Distinct process keys with the active version (null if none) plus title and icon, for the operator menu and the designer process list."
      operationId: listProcesses
      responses:
        "200":
          description: Process menu entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProcessMenuEntry' }

  /instances:
    get:
      tags: [Instances]
      summary: List instance summaries (monitoring)
      description: >
        Newest-first instance summaries for the monitoring view, optionally filtered by processKey,
        status, and warehouseId, capped at limit (default 50, max 500).
      operationId: listInstances
      parameters:
        - { name: processKey, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [RUNNING, DONE] }
        - { name: warehouseId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Instance summaries (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InstanceSummary' }
    post:
      tags: [Instances]
      summary: Start an instance of a process key's ACTIVE definition
      description: "Creates a RUNNING instance pinned to the ACTIVE definition version and returns the full model JSON, an empty data object, and the start step."
      operationId: startInstance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartInstanceRequest' }
      responses:
        "201":
          description: Started instance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceView' }
        "404": { description: "No active definition for this key" }

  /instances/{id}:
    get:
      tags: [Instances]
      summary: Resume an instance
      description: "Returns the pinned definition, the current data object, the current step, and the status, so a device swap or reload resumes mid-flow."
      operationId: getInstance
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Instance state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceView' }
        "404": { description: Not found }

  /instances/{id}/checkpoint:
    post:
      tags: [Instances]
      summary: Run a task-step checkpoint
      description: >
        The step must be a task step. The posted data object is merged into the instance, the
        curated task for that step runs (with the operator's identity forwarded), its outputs merge
        back, and the instance is persisted and advanced to the step's next. Idempotent on
        (instanceId, stepId): re-posting the same checkpoint returns the stored result without
        re-running side effects. A failing task returns 502 and does not advance the instance.
      operationId: checkpointInstance
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckpointRequest' }
      responses:
        "200":
          description: Merged data plus next step and done flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckpointResult' }
        "400": { description: "Step is not a task step or is unknown" }
        "404": { description: Instance or step not found }
        "502": { description: "The curated task failed, the instance did not advance" }

  /assist/task:
    post:
      tags: [Assist]
      summary: AI task-assist (design-time suggestion, never auto-deploy)
      description: >
        Design-time only (spec §7.3). Given a plain-language description and the available data-object
        variables, the model returns a SUGGESTION the designer may apply: either the best-fit curated
        task type with proposed input/output mappings, or, if nothing fits, a DRAFT sandboxed JS
        snippet for the user to review and insert into a script step. This endpoint NEVER changes
        server state, never saves, and never runs code. Gated by PROCESS_DESIGN_EDIT. Returns 503 when
        no Anthropic key is configured (ANTHROPIC_API_KEY). The drafted script is unreviewed text.
      operationId: assistTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskAssistRequest' }
      responses:
        "200":
          description: A structured suggestion (curated mapping, script draft, or none)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskAssistResult' }
        "403": { description: "Missing PROCESS_DESIGN_EDIT permission" }
        "502": { description: "The AI model call failed" }
        "503": { description: "AI assist not configured (no Anthropic key)" }

  /capabilities:
    get:
      tags: [Assist]
      summary: Phase 3 capabilities for the frontend
      description: >
        What the designer UI should show/hide (spec §7.2/§7.3): whether the sandboxed-scripting flag
        is enabled, whether AI assist is configured, and whether the caller may author script steps
        (holds PROCESS_SCRIPT_AUTHOR; always true when security is disabled). Gated by
        PROCESS_DESIGN_VIEW.
      operationId: getCapabilities
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitiesView' }
        "403": { description: "Missing PROCESS_DESIGN_VIEW permission" }

  /verify:
    post:
      tags: [Verify]
      summary: Scan-verify proxy (resolve a scanned value against master-data)
      description: >
        The handheld runtime posts a scanned/typed value for a screen "Verify" step; the proxy
        resolves it against master-data (forwarding the operator identity, so the handheld never hits
        master-data directly) and returns a normalised result the runtime branches on and stores from.
        kind selects the resolve: barcode (match a barcode to its SKU), sku (match a SKU by code),
        location (match a location by code), or skuScan (combined: try the value as a product barcode
        first, else as a SKU code, and signal whether the operator must pick a UOM).
        Read-only and stateless (no instance/ledger persistence).
        Gated by PROCESS_DESIGN_VIEW (the permission operators use to run processes). A miss is a clean
        200 with found:false (never 404); a downstream failure is 502.
      operationId: verify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyRequest' }
      responses:
        "200":
          description: Normalised resolution (found true with linked ids, or a found:false passthrough)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyResult' }
        "400": { description: "Malformed request (missing warehouseId/kind/code, or unknown kind)" }
        "403": { description: "Missing PROCESS_DESIGN_VIEW permission" }
        "502": { description: "The master-data resolve call failed" }

components:
  schemas:
    ProcessModel:
      type: object
      description: "The process model document: data-object schema, ordered steps with transitions, and the start step."
      properties:
        processKey: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        title: { type: string }
        icon: { type: string }
        dataSchema:
          type: array
          items: { $ref: '#/components/schemas/DataField' }
        start: { type: string }
        steps:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Step' }
      additionalProperties: true

    DataField:
      type: object
      properties:
        name: { type: string }
        type:
          type: string
          description: "Primitive (string, number, boolean, date) or domain type (sku, location, hu)."
      required: [name, type]

    Step:
      type: object
      description: "A screen step (renders a handheld screen, captures input) or a task step (runs server-side work)."
      properties:
        type: { type: string, enum: [screen, task] }
        screen:
          type: string
          enum: [textInput, numberInput, dateInput, acknowledge, questionYesNo, questionChoice]
        config:
          type: object
          additionalProperties: true
          description: >
            "Per-step config. For a screen step: header, detail, writeTo, validation, scanBinding, and
            an optional verify block (see VerifyConfig) that resolves the submitted value against
            master-data and lets the flow branch / store linked ids. For a script task step
            (task = script): { script: <js>, outputs: [{ name }] } — the snippet reads a frozen global
            data object and returns a plain object whose declared outputs merge back into the data
            object."
        task:
          type: string
          description: >
            "Curated task type, e.g. inventory.move, slotting.putaway, picking.confirm,
            inventory.lookup, txlog.post, host.confirm, inventory.adjust, counting.capture,
            order.lookup. The special type 'script' (spec §7.2) runs a sandboxed JS snippet from
            config.script and merges config.outputs back; authoring it requires the scripting flag
            plus PROCESS_SCRIPT_AUTHOR (enforced at save/publish)."
        input:
          type: object
          additionalProperties: { type: string }
          description: "Task input name to a data-object variable name, or literal:VALUE for a constant."
        output:
          type: object
          additionalProperties: { type: string }
          description: "Data-object variable name to a task output name (renames the task output as it merges back)."
        transitions:
          type: array
          items: { $ref: '#/components/schemas/Transition' }
        next:
          type: string
          description: "Default next step; null or no matching transition ends the instance."
        skipWhen:
          type: string
          description: >
            Optional restricted condition (same grammar as a transition when). When it evaluates
            true the client skips this step and continues via the onward path. The server validates
            it at publish time (it must parse and the step must still have a reachable onward path).
      additionalProperties: true

    Transition:
      type: object
      properties:
        when:
          type: string
          description: "Restricted boolean expression over data-object variables, evaluated client-side."
        to: { type: string }
      required: [to]

    DefinitionSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        processKey: { type: string }
        version: { type: integer }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        title: { type: string }
        icon: { type: string }
        publishedAt: { type: string, format: date-time }
        publishedBy: { type: string }
        updatedAt: { type: string, format: date-time }

    ProcessMenuEntry:
      type: object
      properties:
        processKey: { type: string }
        activeVersion: { type: integer, nullable: true }
        title: { type: string }
        icon: { type: string }

    CreateDefinitionRequest:
      type: object
      properties:
        processKey: { type: string }
        title: { type: string }
        icon: { type: string }
        dataSchema:
          type: array
          items: { $ref: '#/components/schemas/DataField' }
        steps:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Step' }
        start: { type: string }
      required: [processKey, title]

    ValidationProblem:
      type: object
      properties:
        error: { type: string }
        problems:
          type: array
          items: { type: string }

    StartInstanceRequest:
      type: object
      properties:
        processKey: { type: string }
        warehouseId: { type: string, format: uuid, nullable: true }
      required: [processKey]

    InstanceView:
      type: object
      properties:
        instanceId: { type: string, format: uuid }
        processKey: { type: string }
        defVersion: { type: integer }
        status: { type: string, enum: [RUNNING, DONE] }
        def: { $ref: '#/components/schemas/ProcessModel' }
        data:
          type: object
          additionalProperties: true
        currentStep: { type: string, nullable: true }

    CheckpointRequest:
      type: object
      properties:
        stepId: { type: string }
        data:
          type: object
          additionalProperties: true
      required: [stepId]

    CheckpointResult:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
        currentStep: { type: string, nullable: true }
        done: { type: boolean }

    TaskSpec:
      type: object
      description: "A curated task type's self-describing metadata for the designer's task picker."
      properties:
        type:
          type: string
          description: "The task-type string used in a step's task field, e.g. inventory.move."
        label: { type: string }
        inputs:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              required: { type: boolean }
        outputs:
          type: array
          items:
            type: object
            properties:
              name: { type: string }

    InstanceSummary:
      type: object
      description: "A lightweight instance summary for the monitoring list (no data object or definition body)."
      properties:
        instanceId: { type: string, format: uuid }
        processKey: { type: string }
        defVersion: { type: integer }
        status: { type: string, enum: [RUNNING, DONE] }
        currentStep: { type: string, nullable: true }
        startedBy: { type: string }
        warehouseId: { type: string, format: uuid, nullable: true }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskAssistRequest:
      type: object
      description: "AI task-assist input (spec §7.3): a description plus the available data variables."
      properties:
        description:
          type: string
          description: "Plain-language description of what the task step should achieve."
        variables:
          type: array
          description: "The data-object variables available to map to (or for a script to read)."
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
      required: [description]

    TaskAssistResult:
      type: object
      description: >
        "A design-time suggestion (spec §7.3). NEVER saved or executed by the server. kind=curated
        proposes a curated task type with input/output mappings; kind=script returns a DRAFT sandboxed
        JS snippet for human review; kind=none means nothing fits."
      properties:
        kind: { type: string, enum: [curated, script, none] }
        taskType:
          type: string
          nullable: true
          description: "When kind=curated, the chosen curated task type id."
        inputs:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: "When kind=curated, taskInputName to a data variable name or literal:VALUE."
        outputs:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: "When kind=curated, taskOutputName to a data variable name."
        script:
          type: string
          nullable: true
          description: "When kind=script, a DRAFT JS snippet for human review (not executed)."
        rationale: { type: string }
        confidence: { type: number, description: "Confidence 0..1." }
      required: [kind, rationale, confidence]

    CapabilitiesView:
      type: object
      description: "Phase 3 capabilities for the designer UI (spec §7.2/§7.3)."
      properties:
        scriptingEnabled:
          type: boolean
          description: "Whether the sandboxed-scripting flag is enabled (off by default)."
        aiAssistEnabled:
          type: boolean
          description: "Whether AI task-assist is configured (an Anthropic key is present)."
        canAuthorScript:
          type: boolean
          description: "Whether the caller may author script steps (holds PROCESS_SCRIPT_AUTHOR)."
        verifyKinds:
          type: array
          items: { type: string, enum: [barcode, sku, location, skuScan] }
          description: >
            The server-driven list of scan-verify kinds the screen "Verify" picker offers. A constant
            list so the designer does not hard-code it.

    VerifyConfig:
      type: object
      description: >
        "Optional screen-step verify block (config.verify). On submit the runtime resolves the entered
        value against master-data via POST /verify; on found it may write resolved fields into
        data-object variables, and on not-found it reprompts or jumps to another step. The frontend
        performs the branch + writes at runtime; the server validates this shape at publish time."
      properties:
        kind:
          type: string
          enum: [barcode, sku, location, skuScan]
          description: "Which master-data resolve to run for the submitted value."
        write:
          type: object
          additionalProperties: { type: string }
          description: >
            "Map of resolved field -> data-object variable name to store on a found result. The key
            must be one of: id, code, name, uomCode, schemaCategory; the value must be a declared
            data-object variable (enforced at publish)."
        onNotFound:
          type: object
          description: "What to do when master-data returns found:false."
          properties:
            mode:
              type: string
              enum: [reprompt, goto]
              description: "reprompt re-shows the screen; goto jumps to onNotFound.step."
            step:
              type: string
              description: "Target step id when mode=goto (must exist; enforced at publish)."
          required: [mode]
      required: [kind]

    VerifyRequest:
      type: object
      description: "Scan-verify proxy request: resolve a scanned/typed value against master-data."
      properties:
        warehouseId: { type: string, format: uuid }
        kind:
          type: string
          enum: [barcode, sku, location, skuScan]
          description: "Which master-data resolve to run."
        code:
          type: string
          description: "The scanned/typed value (a barcode, SKU code, or location code)."
      required: [warehouseId, kind, code]

    VerifyResult:
      type: object
      description: >
        "Normalised scan-verify resolution the handheld runtime branches on and stores from. found
        false is a clean passthrough (the value did not resolve), not an error."
      properties:
        found:
          type: boolean
          description: "Whether master-data matched the value."
        ambiguous:
          type: boolean
          nullable: true
          description: "For a barcode, true when it matched more than one SKU (null/false otherwise)."
        id:
          type: string
          nullable: true
          description: "sku.skuId (barcode/sku) or location.locationId (location); null when not found."
        code:
          type: string
          nullable: true
          description: "sku.code or location.code; null when not found."
        name:
          type: string
          nullable: true
          description: "sku.description (barcode/sku); null for location."
        uomCode:
          type: string
          nullable: true
          description: >
            "matchedBarcode.uomCode (barcode) or the base uom code (sku); null for location, and null
            for a skuScan that matched a SKU code with more than one UOM (operator must pick)."
        schemaCategory:
          type: string
          nullable: true
          description: "attributeSchema.category (barcode/sku); null otherwise."
        matchedAs:
          type: string
          nullable: true
          enum: [barcode, sku]
          description: >
            "How the value resolved: barcode (a product barcode matched) or sku (a SKU code matched);
            null for location and not-found. For the combined skuScan kind this signals which path fired."
        uoms:
          type: array
          description: >
            "The resolved SKU's full UOM list for the runtime's UOM picker. Empty for location and
            not-found."
          items:
            type: object
            properties:
              code: { type: string, nullable: true }
              baseUnit: { type: boolean }
        needsUomChoice:
          type: boolean
          description: >
            "True only for a skuScan that matched a SKU code with more than one UOM (the runtime must
            prompt the operator). False otherwise: a barcode pins its UOM, a single-UOM SKU auto-picks,
            and the plain sku kind never prompts."
        detail:
          type: object
          additionalProperties: true
          description: >
            "The full master-data graph for the kind: uoms, barcodes, attributeSchema, matchedBarcode
            for sku/barcode; the location object for location. Empty when not found."
      required: [found, uoms, needsUomChoice, detail]
