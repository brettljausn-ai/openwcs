openapi: 3.0.3
info:
  title: openWCS Flow Orchestrator API
  version: 0.1.0
  description: >
    Dispatches device tasks to equipment adapters over the uniform internal device contract
    (build.md §8). A task is recorded REQUESTED → DISPATCHED → COMPLETED/FAILED. The first
    transport is synchronous HTTP to the adapter (simulator-friendly); the production contract
    is asynchronous over Kafka (`device.tasks` / `device.results`). Tasks carry a correlation
    id so a higher-level process (BPMN) can group the moves it triggered.
servers:
  - url: /api/flow
    description: Via the API gateway

tags:
  - name: DeviceTasks
  - name: Moves
  - name: ConveyorRouting
  - name: Reports
  - name: Twin

paths:
  /conveyor/topology:
    get:
      tags: [ConveyorRouting]
      summary: Load a warehouse's conveyor topology (for the admin schematic editor)
      operationId: getTopology
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The topology graph
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topology' }
    put:
      tags: [ConveyorRouting]
      summary: Replace a warehouse's conveyor topology (editor save)
      operationId: saveTopology
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Topology' }
      responses:
        "200":
          description: The saved topology
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Topology' }
        "400": { description: An edge references an unknown node code }
  /conveyor/routes:
    post:
      tags: [ConveyorRouting]
      summary: Assign a handling unit an ordered route plan (target node codes)
      operationId: assignRoute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteRequest' }
      responses:
        "200":
          description: The active route plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteView' }
    get:
      tags: [ConveyorRouting]
      summary: Get a handling unit's active route plan
      operationId: getRoute
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: barcode
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The route plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteView' }
        "404": { description: No active route plan }
  /conveyor/routing-requests:
    post:
      tags: [ConveyorRouting]
      summary: Decide where a scanned handling unit goes next
      description: An adapter posts {node, barcode}; the WCS returns the routing decision (next hop toward the current target).
      operationId: routingRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanRequest' }
      responses:
        "200":
          description: Routing decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoutingDecision' }
  /conveyor/observations:
    post:
      tags: [ConveyorRouting]
      summary: Ingest a scan observation for topology learning
      description: A sniffer (defined-IP capture) posts observed {node, barcode}; the WCS infers a candidate topology.
      operationId: observe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservationRequest' }
      responses:
        "202": { description: Accepted }
        "400": { description: Invalid observedAt }
  /conveyor/discovery:
    get:
      tags: [ConveyorRouting]
      summary: Inferred topology suggestions from observations
      operationId: discover
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Candidate nodes/edges/targets (known flags mark what already exists)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Discovery' }

  /device-tasks:
    post:
      tags: [DeviceTasks]
      summary: Dispatch a device task
      description: >
        Records the task, dispatches it to the adapter resolved by equipment family, and
        returns the task with its terminal status. Requires DEVICE_OPERATE.
      operationId: requestDeviceTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestDeviceTask' }
      responses:
        "201":
          description: Task recorded (COMPLETED or FAILED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceTask' }
        "400":
          description: Invalid request
        "403":
          description: Missing DEVICE_OPERATE
        "422":
          description: No adapter configured for the equipment family
        "502":
          description: Adapter unreachable
    get:
      tags: [DeviceTasks]
      summary: List / search device tasks
      description: >
        Lists device tasks. With `correlationId` returns that correlation's tasks oldest-first;
        otherwise returns the most recent tasks newest-first, optionally filtered by warehouse,
        status, equipment family or equipment id. Powers the Transport overview screen. Requires
        DEVICE_VIEW.
      operationId: listDeviceTasks
      parameters:
        - name: correlationId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: family
          in: query
          required: false
          schema: { type: string }
        - name: equipmentId
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Max rows when not filtering by correlationId (default 100, max 500).
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Device tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceTask' }
        "403":
          description: Missing DEVICE_VIEW
  /device-tasks/{id}:
    get:
      tags: [DeviceTasks]
      summary: Get a device task
      operationId: getDeviceTask
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Device task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceTask' }
        "403":
          description: Missing DEVICE_VIEW
        "404":
          description: Not found

  /moves:
    post:
      tags: [Moves]
      summary: Dispatch a generic physical move of a handling unit
      description: >
        Dispatches the device task(s) that physically move a handling unit from one location to
        another and returns the dispatched device-task id (the first leg). The transport is chosen by
        where the locations live: a SAME-system / in-aisle move (both ends in one storage block)
        issues a single RELOCATE through the existing device-task machinery (AUTOSTORE maps to
        BIN_RELOCATE, every other family to RELOCATE, ADR-0009); a CROSS-system move (different
        storage blocks, or a storage slot to a conveyor/pick-face on a different family) runs a
        multi-leg chain RETRIEVE then CONVEY then STORE, each leg's completion advancing the next.
        On completion the move books the HU's destination location in inventory; the HU's riding stock
        follows it automatically (the inventory stock projection resolves HU-bound buckets to the HU's
        current location), so NO StockMoved is emitted for HU-bound stock. Requires DEVICE_OPERATE.
      operationId: dispatchMove
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlowMoveRequest' }
      responses:
        "201":
          description: Move dispatched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlowMoveResult' }
        "400":
          description: Invalid request
        "403":
          description: Missing DEVICE_OPERATE
        "422":
          description: No adapter configured for the equipment family
        "502":
          description: Adapter unreachable

  /twin/tote-paths:
    get:
      tags: [Twin]
      summary: Live-twin tote paths (the visu master read model)
      description: >
        Every moving tote's backend-resolved conveyor polyline in world XZ metres plus the server
        clock, so the hardware visualisation plays a backend-supplied path instead of reconstructing
        it from a thin scan feed. Requires DEVICE_VIEW.
      operationId: twinTotePaths
      parameters:
        - $ref: '#/components/parameters/TwinWarehouseId'
      responses:
        "200":
          description: In-transit tote paths
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TwinPaths' }
        "403":
          description: Missing DEVICE_VIEW
  /twin/amr-fleet:
    get:
      tags: [Twin]
      summary: Live AMR fleet positions, status and carried HU
      description: >
        Per active AMR robot, its world XZ position (metres), status (IDLE/MOVING/FAULTED) and carried
        handling unit if any, derived from the AMR-family device tasks and the equipment-emulator's
        telemetry (positions resolve from placed_equipment where the emulator omits them). Best-effort,
        it returns an empty fleet when the emulator is off or unreachable. Requires DEVICE_VIEW.
      operationId: twinAmrFleet
      parameters:
        - $ref: '#/components/parameters/TwinWarehouseId'
      responses:
        "200":
          description: AMR fleet snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AmrFleet' }
        "403":
          description: Missing DEVICE_VIEW
  /twin/autostore:
    get:
      tags: [Twin]
      summary: Live AutoStore grid fill and port activity
      description: >
        AutoStore grid dimensions plus occupied/total bins and per-port activity (busy flag, handling
        unit at the port), derived from the AutoStore-family device tasks and the equipment-emulator's
        telemetry. Best-effort, it returns a zeroed grid and empty ports when the emulator is off or
        unreachable. Requires DEVICE_VIEW.
      operationId: twinAutostore
      parameters:
        - $ref: '#/components/parameters/TwinWarehouseId'
      responses:
        "200":
          description: AutoStore grid + ports snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autostore' }
        "403":
          description: Missing DEVICE_VIEW
  /twin/asrs-cranes:
    get:
      tags: [Twin]
      summary: Live ASRS crane positions, status and carried HU
      description: >
        Per ASRS crane, its world coordinates (x/z metres aisle floor position, y the lift height in
        metres), status (IDLE/MOVING/FAULTED) and carried handling unit if any, read from the
        equipment-emulator's crane telemetry (world coords resolve from placed_equipment by code where
        the emulator omits them). Best-effort, it returns an empty list when the emulator is off or
        unreachable. Requires DEVICE_VIEW.
      operationId: twinAsrsCranes
      parameters:
        - $ref: '#/components/parameters/TwinWarehouseId'
      responses:
        "200":
          description: ASRS crane snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsrsCranes' }
        "403":
          description: Missing DEVICE_VIEW

  /reports/scan-quality:
    get:
      tags: [Reports]
      summary: Scans / no-reads / unknowns per scan point per day
      description: >
        Daily scan-quality counters per conveyor scan point, accumulated by the routing scan path
        from deployment day: every answered scan, scanner read errors (blank/"NOREAD" barcodes)
        and readable barcodes with no active route plan. Powers the scanner-error report (the UI
        forecasts failing scanners over the history). Requires DEVICE_VIEW.
      operationId: reportScanQuality
      parameters:
        - $ref: '#/components/parameters/ReportWarehouseId'
        - $ref: '#/components/parameters/ReportDays'
      responses:
        "200":
          description: Per-node daily scan-quality rows (day ascending)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScanQualityRow' }
        "403":
          description: Missing DEVICE_VIEW
  /reports/traffic:
    get:
      tags: [Reports]
      summary: Conveyor traffic per directed edge per day (heatmap)
      description: >
        Daily ROUTE-answer counters per directed conveyor edge (including divert-default routes),
        accumulated by the routing scan path. Powers the traffic heatmap of the conveyor system.
        Requires DEVICE_VIEW.
      operationId: reportTraffic
      parameters:
        - $ref: '#/components/parameters/ReportWarehouseId'
        - $ref: '#/components/parameters/ReportDays'
      responses:
        "200":
          description: Per-edge daily traffic rows (day ascending)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrafficRow' }
        "403":
          description: Missing DEVICE_VIEW
  /reports/storage-movements:
    get:
      tags: [Reports]
      summary: Storage movements per location per day (ASRS heatmap)
      description: >
        Completed STORE/RETRIEVE (and AutoStore BIN_*) device tasks aggregated per storage
        location per day. locationId is null when the task carried no location (e.g. degraded
        slotting). Powers the storage-movement heatmap. Requires DEVICE_VIEW.
      operationId: reportStorageMovements
      parameters:
        - $ref: '#/components/parameters/ReportWarehouseId'
        - $ref: '#/components/parameters/ReportDays'
      responses:
        "200":
          description: Per-location daily movement rows (day ascending)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StorageMovementRow' }
        "403":
          description: Missing DEVICE_VIEW
  /reports/device-movements:
    get:
      tags: [Reports]
      summary: Device-task throughput and failures per equipment per day
      description: >
        All device tasks aggregated per equipment per day, split into completed and failed.
        equipment is the best available label: the placed equipment's code, else the raw
        equipment id, else the family. Requires DEVICE_VIEW.
      operationId: reportDeviceMovements
      parameters:
        - $ref: '#/components/parameters/ReportWarehouseId'
        - $ref: '#/components/parameters/ReportDays'
      responses:
        "200":
          description: Per-equipment daily throughput rows (day ascending)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceMovementRow' }
        "403":
          description: Missing DEVICE_VIEW
  /reports/transit-times:
    get:
      tags: [Reports]
      summary: Induct-to-arrival transit-time distribution per day
      description: >
        For each induction entry, the time between its INDUCTED trace row (HU left storage onto
        the conveyor) and its ARRIVED row (HU reached the induction point), aggregated per arrival
        day as sample count + p50/p95 milliseconds. Requires DEVICE_VIEW.
      operationId: reportTransitTimes
      parameters:
        - $ref: '#/components/parameters/ReportWarehouseId'
        - $ref: '#/components/parameters/ReportDays'
      responses:
        "200":
          description: Daily transit-time distribution rows (day ascending)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TransitTimeRow' }
        "403":
          description: Missing DEVICE_VIEW
  /reports/decision-latency:
    get:
      tags: [Reports]
      summary: Per-scan routing decision latency of this instance
      description: >
        End-to-end latency of the per-scan routing decision (POST /conveyor/routing-requests),
        measured in-process and held in a fixed-size in-memory ring buffer (the last 4096
        decisions). Per replica and reset on restart: a live health gauge for the hard-real-time
        scan path's ~10 ms budget, not durable history (the daily counters cover history).
        Requires DEVICE_VIEW.
      operationId: reportDecisionLatency
      responses:
        "200":
          description: Latency percentiles over this instance's ring-buffer window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionLatencyStats' }
        "403":
          description: Missing DEVICE_VIEW
  /reports/automation-summary:
    get:
      tags: [Reports]
      summary: Warehouse automation health snapshot (dashboards/alerting)
      description: >
        A small snapshot for the automation dashboard and the alert evaluator: today's scanner
        no-read percentage (no-reads / scans over today's scan_stat rows, 0 when nothing scanned
        yet) and equipment availability (placed equipment NOT currently in fault / total placed,
        100 when nothing is placed). An equipment counts as in fault when its most recent
        device_task is FAILED. Requires DEVICE_VIEW.
      operationId: reportAutomationSummary
      parameters:
        - $ref: '#/components/parameters/ReportWarehouseId'
      responses:
        "200":
          description: Automation health snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationSummary' }
        "403":
          description: Missing DEVICE_VIEW

components:
  parameters:
    ReportWarehouseId:
      name: warehouseId
      in: query
      required: true
      schema: { type: string, format: uuid }
    ReportDays:
      name: days
      in: query
      required: false
      description: History window in days, today inclusive (default 90, capped at 180).
      schema: { type: integer, default: 90, maximum: 180, minimum: 1 }
    TwinWarehouseId:
      name: warehouseId
      in: query
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Topology:
      type: object
      description: A warehouse's conveyor graph — the load/save shape for the admin editor.
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/NodeDto' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/EdgeDto' }
        loops:
          type: array
          items: { $ref: '#/components/schemas/LoopDto' }
    NodeDto:
      type: object
      required: [code]
      properties:
        code: { type: string, description: Node id the hardware sends on a scan. }
        name: { type: string, nullable: true }
        hardwareAddress: { type: string, nullable: true, description: "How the equipment is reached (PLC/OPC-UA address, IP:port…)." }
        posX: { type: number, nullable: true, description: Layout X for the schematic editor. }
        posY: { type: number, nullable: true }
        loopCode: { type: string, nullable: true, description: "The loop this node belongs to, if any." }
        defaultExitCode: { type: string, nullable: true, description: "For a divert node: the neighbour an unrouted HU takes by default (projected from the divert's STRAIGHT/BRANCH choice); null = stop at the divert." }
    LoopDto:
      type: object
      required: [code, maxHus]
      properties:
        code: { type: string }
        maxHus: { type: integer, description: Max handling units allowed in the loop at once. }
        whenFull: { type: string, enum: [HOLD, OVERFLOW], default: HOLD }
        overflowTarget: { type: string, nullable: true, description: Target node code when whenFull=OVERFLOW. }
    EdgeDto:
      type: object
      required: [fromCode, toCode, exitCode]
      properties:
        fromCode: { type: string }
        toCode: { type: string }
        exitCode: { type: string, description: The decision the hardware applies to traverse this edge. }
        cost: { type: integer, default: 1 }
    RouteRequest:
      type: object
      required: [warehouseId, barcode, targets]
      properties:
        warehouseId: { type: string, format: uuid }
        barcode: { type: string }
        targets:
          type: array
          items: { type: string }
          description: Ordered target node codes the handling unit must visit.
    RouteView:
      type: object
      properties:
        warehouseId: { type: string, format: uuid }
        barcode: { type: string }
        targets: { type: array, items: { type: string } }
        currentIndex: { type: integer }
        status: { type: string, enum: [ACTIVE, COMPLETED, EXCEPTION] }
        detail: { type: string, nullable: true }
    ScanRequest:
      type: object
      required: [warehouseId, node]
      properties:
        warehouseId: { type: string, format: uuid }
        node: { type: string, description: The node code where the HU was scanned. }
        barcode:
          type: string
          nullable: true
          description: >
            The scanned barcode. Blank, missing or "NOREAD" means a scanner read error: the
            decision then follows the node's divert default (or stops at a defaultless divert),
            exactly like an unknown HU.

    RoutingDecision:
      type: object
      properties:
        action: { type: string, enum: [ROUTE, COMPLETE, HOLD, NO_ROUTE, EXCEPTION] }
        exitCode: { type: string, nullable: true, description: The decision to apply at this node (ROUTE). }
        toNode: { type: string, nullable: true, description: The next node the HU is routed to. }
        currentTarget: { type: string, nullable: true }
        targetReached: { type: string, nullable: true }
        detail: { type: string, nullable: true }
    ObservationRequest:
      type: object
      required: [warehouseId, node, barcode]
      properties:
        warehouseId: { type: string, format: uuid }
        node: { type: string }
        barcode: { type: string }
        sourceIp: { type: string, nullable: true, description: IP the scan was decoded from. }
        observedAt: { type: string, format: date-time, nullable: true }
    Discovery:
      type: object
      description: Inferred topology suggestions; known flags mark what already exists in the configured graph.
      properties:
        nodes:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              observedCount: { type: integer, format: int64 }
              sourceIp: { type: string, nullable: true }
              known: { type: boolean }
        edges:
          type: array
          items:
            type: object
            properties:
              fromCode: { type: string }
              toCode: { type: string }
              count: { type: integer, format: int64 }
              known: { type: boolean }
        targets:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              terminalCount: { type: integer, format: int64 }
    RequestDeviceTask:
      type: object
      required: [warehouseId, family, command]
      properties:
        warehouseId: { type: string, format: uuid }
        family:
          type: string
          description: Equipment family that selects the adapter, e.g. CONVEYOR.
          example: CONVEYOR
        equipmentId:
          type: string
          format: uuid
          nullable: true
        command:
          type: string
          description: Adapter command, e.g. CONVEY | DIVERT | MERGE | SCAN.
          example: CONVEY
        payload:
          type: object
          additionalProperties: true
        correlationId:
          type: string
          format: uuid
          nullable: true
    DeviceTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        family: { type: string }
        equipmentId: { type: string, format: uuid, nullable: true }
        command: { type: string }
        payload:
          type: object
          additionalProperties: true
        correlationId: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [REQUESTED, DISPATCHED, COMPLETED, FAILED]
        detail: { type: string, nullable: true }
        result:
          type: object
          additionalProperties: true
          nullable: true
        actor: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ScanQualityRow:
      type: object
      description: Daily scan-quality counters of one scan point.
      properties:
        node: { type: string, description: Scan point (conveyor node code). }
        day: { type: string, format: date }
        scans: { type: integer, format: int64, description: Scans answered at the node that day. }
        noReads: { type: integer, format: int64, description: Scanner read errors (blank/"NOREAD"). }
        unknowns: { type: integer, format: int64, description: Readable barcodes with no active route plan. }
    TrafficRow:
      type: object
      description: Daily traffic over one directed conveyor edge (heatmap weight).
      properties:
        fromNode: { type: string }
        toNode: { type: string }
        day: { type: string, format: date }
        count: { type: integer, format: int64, description: ROUTE answers over the edge that day. }
    StorageMovementRow:
      type: object
      description: Completed storage movements at one location on one day.
      properties:
        locationId: { type: string, format: uuid, nullable: true, description: Null when the task carried no location id. }
        day: { type: string, format: date }
        stores: { type: integer, format: int64, description: Completed STORE/BIN_STORE tasks. }
        retrieves: { type: integer, format: int64, description: Completed RETRIEVE/BIN_RETRIEVE tasks. }
    DeviceMovementRow:
      type: object
      description: Device-task throughput of one equipment on one day.
      properties:
        equipment: { type: string, description: "Best available label: placed-equipment code, else equipment id, else family." }
        family: { type: string, description: CONVEYOR | ASRS | AMR | AUTOSTORE. }
        day: { type: string, format: date }
        completed: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
    TransitTimeRow:
      type: object
      description: Induct-to-arrival transit-time distribution of one day.
      properties:
        day: { type: string, format: date }
        count: { type: integer, format: int64, description: Induction entries that arrived that day. }
        p50Ms: { type: integer, format: int64, description: Median transit time in milliseconds. }
        p95Ms: { type: integer, format: int64, description: 95th-percentile transit time in milliseconds. }
    DecisionLatencyStats:
      type: object
      description: >
        Per-scan routing decision latency of one instance, over its in-memory ring-buffer window
        (the last up-to-4096 decisions). Milliseconds with microsecond resolution.
      properties:
        count: { type: integer, format: int64, description: Decisions in the window the percentiles are computed over. }
        p50Ms: { type: number, format: double, description: Median decision latency in milliseconds. }
        p95Ms: { type: number, format: double }
        p99Ms: { type: number, format: double }
        maxMs: { type: number, format: double, description: Slowest decision in the window. }
    AutomationSummary:
      type: object
      description: >
        Warehouse automation health snapshot for the dashboards/alerting epic.
      properties:
        scanNoReadPctToday:
          type: number
          format: double
          description: Today's scanner no-read rate as a percentage (no-reads / scans; 0 when nothing scanned yet).
        equipmentAvailabilityPct:
          type: number
          format: double
          description: Placed equipment NOT currently in fault / total placed, as a percentage (100 when nothing is placed).
        equipmentTotal:
          type: integer
          format: int64
          description: Total equipment placed in the warehouse.
        equipmentInFault:
          type: integer
          format: int64
          description: Placed equipment whose most recent device task is FAILED.
    FlowMoveRequest:
      type: object
      required: [warehouseId, huId, toLocationId]
      description: Request to physically move a handling unit from one location to another.
      properties:
        warehouseId: { type: string, format: uuid }
        huId: { type: string, format: uuid, description: The handling unit to move. }
        huCode: { type: string, nullable: true, description: "Human-readable HU code, for the audit trail." }
        fromLocationId: { type: string, format: uuid, nullable: true, description: Source location (informational; the device carries the HU). }
        toLocationId: { type: string, format: uuid, description: Destination location the HU is booked to on completion. }
        family:
          type: string
          nullable: true
          description: "Source equipment family selecting the adapter (default AUTOSTORE). AUTOSTORE maps to BIN_RELOCATE/BIN_RETRIEVE/BIN_STORE, every other family to RELOCATE/RETRIEVE/STORE."
          example: AUTOSTORE
        destFamily:
          type: string
          nullable: true
          description: "Destination equipment family for the cross-system chain STORE leg (defaults to family). Ignored for a same-system single RELOCATE."
          example: ASRS
        crossSystem:
          type: boolean
          nullable: true
          description: "Force the transport choice: true runs the RETRIEVE/CONVEY/STORE chain, false the single RELOCATE. When omitted, it is inferred from the locations' storage blocks (same block is same-system, different/unresolved is cross-system)."
        reason: { type: string, nullable: true, description: Why the move was requested (carried on the move trail). }
    FlowMoveResult:
      type: object
      description: The dispatched move's device-task id.
      properties:
        deviceTaskId: { type: string, format: uuid }
    TwinPaths:
      type: object
      description: "Live-twin tote paths: every in-transit tote's resolved polyline plus the server clock."
      properties:
        serverNowMs: { type: integer, format: int64, description: Server clock at response time (frontend render-clock anchor). }
        totes:
          type: array
          items: { $ref: '#/components/schemas/TotePath' }
    TotePath:
      type: object
      description: One in-transit handling unit's traversed-node polyline in world XZ metres.
      properties:
        huId: { type: string, format: uuid }
        huCode: { type: string, nullable: true }
        state: { type: string, description: "in-transit | recirculating." }
        waypoints:
          type: array
          items: { $ref: '#/components/schemas/Waypoint' }
        next:
          allOf: [{ $ref: '#/components/schemas/Waypoint' }]
          nullable: true
          description: The routed-to node not yet reached (lead edge), or null on arrival.
    Waypoint:
      type: object
      description: "A point on the path: node code, world x/z metres, and the scan time."
      properties:
        code: { type: string }
        x: { type: number, format: double }
        z: { type: number, format: double }
        tMs: { type: integer, format: int64, nullable: true, description: "Scan time in ms (null for the not-yet-reached next node)." }
    AmrFleet:
      type: object
      description: "Live AMR fleet snapshot: per active robot, world XZ position, status and carried HU."
      properties:
        serverTimeMs: { type: integer, format: int64, description: Server clock at response time. }
        amrs:
          type: array
          items: { $ref: '#/components/schemas/Amr' }
    Amr:
      type: object
      properties:
        amrId: { type: string }
        x: { type: number, format: double, description: World X in metres. }
        z: { type: number, format: double, description: World Z (depth) in metres. }
        status: { type: string, enum: [IDLE, MOVING, FAULTED] }
        huCode: { type: string, nullable: true, description: "Carried handling unit code, or null when empty." }
    Autostore:
      type: object
      description: "Live AutoStore snapshot: grid fill and per-port activity."
      properties:
        serverTimeMs: { type: integer, format: int64, description: Server clock at response time. }
        grid: { $ref: '#/components/schemas/AutostoreGrid' }
        ports:
          type: array
          items: { $ref: '#/components/schemas/AutostorePort' }
    AutostoreGrid:
      type: object
      properties:
        columns: { type: integer }
        rows: { type: integer }
        occupiedBins: { type: integer }
        totalBins: { type: integer }
    AutostorePort:
      type: object
      properties:
        portId: { type: string }
        x: { type: number, format: double, description: World X in metres. }
        z: { type: number, format: double, description: World Z (depth) in metres. }
        busy: { type: boolean, description: Whether the port is presenting/working a bin. }
        huCode: { type: string, nullable: true, description: "Handling unit at the port, or null." }
    AsrsCranes:
      type: object
      description: "Live ASRS crane snapshot: per crane, world coordinates, status and carried HU."
      properties:
        serverTimeMs: { type: integer, format: int64, description: Server clock at response time. }
        cranes:
          type: array
          items: { $ref: '#/components/schemas/Crane' }
    Crane:
      type: object
      properties:
        craneId: { type: string }
        x: { type: number, format: double, description: World X in metres. }
        y: { type: number, format: double, description: "Lift height in metres (vertical axis)." }
        z: { type: number, format: double, description: World Z (depth) in metres. }
        status: { type: string, enum: [IDLE, MOVING, FAULTED] }
        huCode: { type: string, nullable: true, description: "Carried handling unit code, or null when empty." }
