openapi: 3.0.3
info:
  title: openWCS Notification & Alerting API
  version: 0.1.0
  description: >
    Threshold-based operational alerting (Dashboards & alerting epic). A periodic, ShedLock-guarded
    evaluator pulls each warehouse's KPIs from the sibling services (flow automation-summary,
    inventory dashboard, allocation stock-blocking, slotting replenishment dashboard, order-management
    dashboard) and compares them against the master-data alert thresholds. A metric over its threshold
    OPENS an alert (WARNING, or CRITICAL when far over); a sustained breach is dedup'd by
    (warehouse, area, metric) so it never duplicates; dropping back under threshold CLEARS it. OPEN and
    CLEAR transitions are delivered best-effort over email (SMTP) and an optional webhook; both degrade
    to log-and-skip when unconfigured. This API exposes the active alert list and supervisor
    acknowledgement.
servers:
  - url: /api/notification
    description: Via the API gateway

tags:
  - name: Alerts

paths:
  /alerts:
    get:
      tags: [Alerts]
      summary: List active alerts for a warehouse
      description: >
        Returns the active (OPEN or ACKED) alerts for a warehouse, newest first. Requires a view
        permission (INVENTORY_VIEW) when edge security is enabled.
      operationId: listAlerts
      parameters:
        - name: warehouseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Active alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertView' }
        "403": { description: Missing view permission }

  /alerts/health:
    get:
      tags: [Alerts]
      summary: Alert-system-health snapshot
      description: >
        Measures the alarm system itself (ISA-18.2): the count of active alerts by severity, per-day
        opened/cleared volume over the window, the chattering (flapping) keys, and stale OPEN alerts.
        Requires a view permission (INVENTORY_VIEW) when edge security is enabled, same as the alert
        list. warehouseId is optional (omit for all warehouses).
      operationId: alertHealth
      parameters:
        - name: warehouseId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: days
          in: query
          required: false
          description: "Window length in UTC days for perDay and chattering (default 14)."
          schema: { type: integer, default: 14, minimum: 1 }
      responses:
        "200":
          description: Alert-system-health snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertHealthView' }
        "403": { description: Missing view permission }

  /alerts/{id}/ack:
    post:
      tags: [Alerts]
      summary: Acknowledge an alert
      description: >
        Marks an active alert ACKED (it stays active/visible but is attributed to the acknowledger).
        Restricted to SUPERVISOR / ADMIN; the actor is the gateway-forwarded X-Auth-User.
      operationId: acknowledgeAlert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The acknowledged alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertView' }
        "403": { description: Requires SUPERVISOR or ADMIN }
        "404": { description: Unknown alert id }
        "409": { description: Alert already cleared }

components:
  schemas:
    AlertView:
      type: object
      properties:
        id: { type: string, format: uuid }
        area:
          type: string
          description: SCAN | RECEIVING | ASRS | ALLOCATION | PUTAWAY | REPLENISHMENT
        severity:
          type: string
          enum: [WARNING, CRITICAL]
        metric:
          type: string
          description: The breached metric key, e.g. scanNoReadPct, asrsUtilisationPct.
        value:
          type: number
          nullable: true
          description: Observed metric value at (re)open.
        threshold:
          type: number
          nullable: true
          description: The threshold it breached.
        sinceIso:
          type: string
          format: date-time
          description: When the alert opened (ISO-8601).
        state:
          type: string
          enum: [OPEN, ACKED, CLEARED]

    AlertHealthView:
      type: object
      description: Alert-system-health snapshot (ISA-18.2 "measure the alarm system").
      properties:
        activeBySeverity:
          type: object
          description: Current count of active (OPEN or ACKED) alerts by severity.
          properties:
            warning: { type: integer, format: int64 }
            critical: { type: integer, format: int64 }
        perDay:
          type: array
          description: "Zero-filled last <days> UTC days, oldest first."
          items:
            type: object
            properties:
              day:
                type: string
                format: date
                description: "UTC day (ISO-8601 date)."
              opened:
                type: integer
                format: int64
                description: "Alerts whose opened_at falls on this day."
              cleared:
                type: integer
                format: int64
                description: "Alerts whose cleared_at falls on this day."
        chattering:
          type: array
          description: >
            Flapping keys: (area, metric) that cleared two or more times in the window, most flaps
            first, top ~10. One CLEARED row in the window counts as one flap (an open-clear cycle).
          items:
            type: object
            properties:
              area: { type: string }
              metric: { type: string }
              flaps:
                type: integer
                format: int64
                description: "Number of CLEARED rows in the window for this key."
        stale:
          type: array
          description: >
            Alerts still OPEN longer than the staleness threshold (default 1440 min, configurable via
            openwcs.alerts.stale-minutes), oldest first, top ~20.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              area: { type: string }
              metric: { type: string }
              ageMin:
                type: integer
                format: int64
                description: "Minutes the alert has been OPEN."
