openapi: 3.0.3
info:
  title: openWCS Inventory API
  version: 0.1.0
  description: >
    Real-time stock and reservations within the automated area (build.md §4.2). Stock
    is the durable projection of the transaction log (kept current by the txlog.stream
    consumer); this API exposes stock buckets, available-to-promise, and the reservation
    lifecycle used by outbound allocation.
servers:
  - url: /api/inventory
    description: Via the API gateway

tags:
  - name: Stock
  - name: Reservations
  - name: Reports

paths:
  /stock:
    get:
      tags: [Stock]
      summary: List stock buckets for a SKU
      description: One row per SKU × batch/lot × location × handling-unit × status bucket.
      operationId: listStock
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: skuId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Stock' }

  /availability:
    get:
      tags: [Stock]
      summary: Available-to-promise for a SKU
      description: "`availableToPromise = onHand − reserved`, counting only AVAILABLE stock."
      operationId: availability
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: skuId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }

  /locations/occupied:
    post:
      tags: [Stock]
      summary: Which of the given locations are physically occupied
      description: >
        Returns the subset of the requested locations that currently hold any stock row or
        handling unit (live occupancy, not a slotting ledger). Slotting put-away uses this to
        score only genuinely-empty locations as candidates. Empty / null input returns an
        empty list.
      operationId: occupiedLocations
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OccupiedLocationsRequest' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OccupiedLocationsResult' }

  /reports/stock-by-sku:
    get:
      tags: [Reports]
      summary: Stock per SKU split into available / allocated / unavailable
      description: >
        Reporting aggregate (single quantities per SKU): `allocated` is the quantity currently
        HELD by reservations, `available` is AVAILABLE-status stock minus the allocated quantity
        (floored at 0), and `unavailable` is non-AVAILABLE-status stock plus anything parked at
        the warehouse's UNKNOWN location (position not known, never usable). With master-data
        unreachable the UNKNOWN reclassification is skipped (best effort, like availability).
      operationId: stockBySkuReport
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StockBySkuRow' }

  /reports/storage-density:
    get:
      tags: [Reports]
      summary: Storage-density history per storage block
      description: >
        One row per storage block per day over the window: total cells = the block's locations
        (master-data), occupied cells = how many of them hold any stock row or handling unit.
        Snapshots are written by a daily ShedLock-guarded sweep; when today has no snapshot yet
        it is taken on demand, so the report answers immediately after deploy.
      operationId: storageDensityReport
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: days, in: query, required: false, schema: { type: integer, default: 90 } }
      responses:
        "200":
          description: OK, oldest day first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StorageDensityRow' }

  /reports/dashboard:
    get:
      tags: [Reports]
      summary: Inventory dashboard KPIs for one warehouse
      description: >
        Read-only dashboard aggregate (best-effort: percentages and the backlog age degrade to
        null rather than failing the response). `husReceivedToday` / `huCount` come from the HU
        table, `skuCountWithStock` is the distinct SKUs with any stock row, `utilisationPct` /
        `asrsUtilisationPct` reuse the storage-density occupied/total-cell computation (today,
        overall and ASRS-typed blocks only), and `putawayBacklog` counts HUs parked at the
        warehouse's RECEIVING / UNKNOWN locations with the oldest one's age in minutes.
      operationId: inventoryDashboard
      parameters:
        - { name: warehouseId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryDashboard' }

  /reservations:
    post:
      tags: [Reservations]
      summary: Reserve (allocate) stock
      description: >
        Holds quantity against available-to-promise. The check runs under a lock on the
        SKU's AVAILABLE rows so concurrent reservations cannot over-allocate; an
        over-request returns 409.
      operationId: reserve
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveRequest' }
      responses:
        "201":
          description: Reserved
          headers:
            Location:
              description: URI of the created reservation.
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        "409":
          description: Insufficient available-to-promise
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "422":
          description: Request failed validation
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [Reservations]
      summary: List reservations for an order
      operationId: reservationsByOrder
      parameters:
        - { name: orderRef, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reservation' }

  /reservations/{reservationId}/release:
    parameters:
      - { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Reservations]
      summary: Release a held reservation
      operationId: releaseReservation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        "404":
          description: Reservation not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /reservations/{reservationId}/consume:
    parameters:
      - { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Reservations]
      summary: Mark a held reservation consumed
      description: Called after the pick is confirmed; the allocation becomes a physical decrement.
      operationId: consumeReservation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        "404":
          description: Reservation not found
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  schemas:
    StockStatus:
      type: string
      enum: [AVAILABLE, LOCKED, QUARANTINE, DAMAGED]
    ReservationStatus:
      type: string
      enum: [HELD, CONSUMED, RELEASED, EXPIRED]
    Stock:
      type: object
      properties:
        stockId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        batchId: { type: string, format: uuid, nullable: true }
        locationId: { type: string, format: uuid }
        huId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/StockStatus' }
        qty: { type: number, description: Quantity in the SKU base UoM. }
        uomCode: { type: string, example: EACH }
    Availability:
      type: object
      properties:
        warehouseId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        onHand: { type: number, description: Sum of AVAILABLE stock. }
        reserved: { type: number, description: Sum of HELD reservations. }
        availableToPromise: { type: number, description: onHand − reserved. }
    OccupiedLocationsRequest:
      type: object
      properties:
        locationIds:
          type: array
          items: { type: string, format: uuid }
          description: The locations to test for physical occupancy.
    OccupiedLocationsResult:
      type: object
      properties:
        occupiedLocationIds:
          type: array
          items: { type: string, format: uuid }
          description: The subset of the requested locations that hold any stock row or handling unit.
    ReserveRequest:
      type: object
      required: [warehouseId, skuId, qty]
      properties:
        warehouseId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        qty: { type: number, minimum: 0, exclusiveMinimum: true }
        batchId: { type: string, format: uuid, nullable: true }
        locationId: { type: string, format: uuid, nullable: true }
        huId: { type: string, format: uuid, nullable: true }
        orderRef: { type: string, nullable: true, description: Outbound order / wave id. }
        correlationId: { type: string, format: uuid, nullable: true, description: Owning process instance. }
        expiresAt: { type: string, format: date-time, nullable: true }
    Reservation:
      type: object
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        batchId: { type: string, format: uuid, nullable: true }
        locationId: { type: string, format: uuid, nullable: true }
        huId: { type: string, format: uuid, nullable: true }
        orderRef: { type: string, nullable: true }
        correlationId: { type: string, format: uuid, nullable: true }
        qty: { type: number }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    StockBySkuRow:
      type: object
      properties:
        skuId: { type: string, format: uuid }
        available: { type: number, description: AVAILABLE stock minus active holds (floored at 0). }
        allocated: { type: number, description: Quantity currently HELD by reservations. }
        unavailable:
          type: number
          description: Non-AVAILABLE-status stock plus anything at the UNKNOWN location.
    StorageDensityRow:
      type: object
      properties:
        blockId: { type: string, format: uuid }
        day: { type: string, format: date }
        occupiedCells: { type: integer, description: Cells holding any stock row or handling unit. }
        totalCells: { type: integer, description: The block's locations (cells) in master-data. }
        pct: { type: number, format: double, description: occupiedCells / totalCells in percent. }
    InventoryDashboard:
      type: object
      properties:
        husReceivedToday: { type: integer, format: int64, description: Handling units created today. }
        huCount: { type: integer, format: int64, description: Total handling units in the warehouse. }
        skuCountWithStock: { type: integer, format: int64, description: Distinct SKUs with any stock row. }
        utilisationPct:
          type: number
          format: double
          nullable: true
          description: Overall storage fill (occupied/total cells); null when not derivable.
        asrsUtilisationPct:
          type: number
          format: double
          nullable: true
          description: ASRS-only storage fill; null when there are no ASRS cells / master-data is down.
        putawayBacklog:
          type: object
          description: HUs received but not yet stored (at RECEIVING / UNKNOWN locations).
          properties:
            count: { type: integer, format: int64 }
            oldestAgeMin:
              type: integer
              format: int64
              nullable: true
              description: Age in minutes of the oldest backlog HU; null when empty / not derivable.
        dockToStock:
          type: object
          description: "Dock-to-stock put-away timing for HUs stored today (UTC): median minutes + sample count."
          properties:
            medianMin:
              type: integer
              format: int64
              nullable: true
              description: "Median minutes from HU received (createdAt) to stored, over HUs stored today; null when no samples."
            samples:
              type: integer
              format: int64
              description: Number of HUs stored today that contributed to the median.
    Problem:
      type: object
      description: RFC 9457 problem detail.
      properties:
        type: { type: string, format: uri, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
