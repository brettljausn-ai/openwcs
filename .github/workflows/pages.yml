name: Deploy public site

# The product site now lives at https://openwcs.ai (Express + EJS app on a Node host).
# The free GitHub Pages mirror (brettljausn-ai.github.io/openwcs) is RETIRED: instead of
# pre-rendering the site, we publish a tiny redirect bundle (public/pages-redirect) that bounces
# every legacy URL — deep links and unknown paths via 404.html — to the matching page on
# openwcs.ai. Runs on every push to main that touches it (and on demand). Pages source must be
# "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'public/pages-redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; let an in-progress run finish rather than cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload redirect bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/pages-redirect
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
