server:
  port: 8097
spring:
  application:
    name: process-designer
  # Service-local store: an isolated `process_designer` schema in dev.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openwcs}
    username: ${SPRING_DATASOURCE_USERNAME:openwcs}
    password: ${SPRING_DATASOURCE_PASSWORD:openwcs}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: process_designer
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: process_designer
    default-schema: process_designer
    create-schemas: true

openwcs:
  # Per-endpoint RBAC (build.md §4.8); off by default so the stack runs before a Keycloak realm.
  security:
    enabled: ${OPENWCS_SECURITY_ENABLED:false}
  process-designer:
    # Base URLs of the services the curated task library calls. The operator's identity
    # (X-Auth-User / X-Auth-Roles / X-Auth-Warehouses) is forwarded so downstream RBAC applies.
    # In-cluster defaults are localhost (host-run dev); compose/k8s override with service DNS.
    flow-base-url: ${OPENWCS_FLOW_ORCHESTRATOR_BASE_URL:http://localhost:8085}
    slotting-base-url: ${OPENWCS_SLOTTING_BASE_URL:http://localhost:8093}
    orders-base-url: ${OPENWCS_ORDER_MANAGEMENT_BASE_URL:http://localhost:8084}
    inventory-base-url: ${OPENWCS_INVENTORY_BASE_URL:http://localhost:8082}
    txlog-base-url: ${OPENWCS_TXLOG_BASE_URL:http://localhost:8086}
    integration-host-base-url: ${OPENWCS_INTEGRATION_HOST_BASE_URL:http://localhost:8092}
    counting-base-url: ${OPENWCS_COUNTING_BASE_URL:http://localhost:8095}
    # Master-data resolve endpoints backing the screen "Verify" step (scan -> confirm exists + pull
    # linked ids). The /verify proxy calls these, forwarding the operator identity; the handheld never
    # hits master-data directly.
    master-data-base-url: ${OPENWCS_MASTER_DATA_BASE_URL:http://localhost:8081}
    # Phase 3 sandboxed scripting escape hatch (spec §7.2). OFF by default: a definition that carries
    # a script step can be saved/published ONLY when this is true AND the caller holds
    # PROCESS_SCRIPT_AUTHOR (defense in depth). The snippet runs in a locked-down GraalJS sandbox
    # (no host/Java access) with a statement limit + wall-clock timeout; it is NEVER compiled to host
    # bytecode. No AI-generated code is ever auto-deployed or executed by the server.
    scripting:
      enabled: ${OPENWCS_PROCESS_SCRIPTING_ENABLED:false}
      statement-limit: ${OPENWCS_PROCESS_SCRIPT_STATEMENT_LIMIT:100000}
      timeout-ms: ${OPENWCS_PROCESS_SCRIPT_TIMEOUT_MS:2000}
      max-output-bytes: ${OPENWCS_PROCESS_SCRIPT_MAX_OUTPUT_BYTES:65536}
    # Phase 3 AI task-assist (spec §7.3, design-time only). The Anthropic key comes from the
    # ANTHROPIC_API_KEY env (same convention as the assistant service); absent -> /assist/task is 503
    # and the context still starts. The model output is a suggestion the designer reviews; it is never
    # saved, compiled, or executed by the server.
    assist:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${OPENWCS_PROCESS_ASSIST_MODEL:claude-haiku-4-5}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
